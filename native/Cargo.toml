[package]
name = "sportspulse"
version = "0.1.0"
edition = "2021"
description = "SportsPulse native Win32 scoreboard (windows-rs rewrite)"

[lib]
name = "sportspulse"
path = "src/lib.rs"

[[bin]]
name = "sportspulse"
path = "src/main.rs"

[[bin]]
name = "sptest"
path = "src/bin_test.rs"

[[bin]]
name = "redbox"
path = "src/bin_redbox.rs"

[[bin]]
name = "spbench"
path = "src/bin_benchmark.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
